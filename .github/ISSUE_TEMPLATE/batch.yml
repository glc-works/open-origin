name: Add a batch
description: Report the quality of one harvest, shipment or production run for a story already on the site.
title: "[Batch] "
labels: ["batch"]
body:
  - type: markdown
    attributes:
      value: Quality changes from batch to batch, so each one is recorded on its own. A maintainer adds it as a file under `batches/`.
  - type: input
    id: story
    attributes:
      label: Link to the story
    validations: { required: true }
  - type: input
    id: date
    attributes:
      label: Date (YYYY, YYYY-MM or YYYY-MM-DD)
      placeholder: 2025-06
    validations: { required: true }
  - type: input
    id: quantity
    attributes:
      label: Quantity in kg (optional)
  - type: textarea
    id: quality
    attributes:
      label: Quality results
      description: One per line as field and value. The fields for each crop are listed in CONTRIBUTING.md.
      placeholder: |
        cupping_score: 85.5
        moisture_pct: 11.2
        defects_primary: 0
    validations: { required: true }
  - type: input
    id: tested_by
    attributes:
      label: Tested by
      description: Who measured it, e.g. "Licensed Q Grader, Name" or your own name. Required for a cupping score; for other results you may leave it empty if you measured them yourself.
  - type: input
    id: certificate
    attributes:
      label: Link to a certificate or lab report (optional)
