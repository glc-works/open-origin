.halo{transform-box:fill-box;transform-origin:center;animation-name:halo;animation-timing-function:cubic-bezier(.16,1,.3,1)}
@keyframes halo{0%,60%{transform:scale(1);opacity:0}62%{opacity:.45}80%,100%{transform:scale(4.5);opacity:0}}
.w{animation-timing-function:cubic-bezier(.16,1,.3,1)}.w1{animation-name:w1}.w2{animation-name:w2}
