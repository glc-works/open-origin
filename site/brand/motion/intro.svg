<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Open Origin"><style>.r1{stroke-dasharray:0.917 0.083;stroke-dashoffset:-0.042}.r2{stroke-dasharray:0.889 0.111;stroke-dashoffset:-0.056}.r3{stroke-dasharray:0.806 0.194;stroke-dashoffset:-0.097}.ln,.dot,.halo,.w{animation-duration:6.5s;animation-iteration-count:infinite;animation-fill-mode:both}
